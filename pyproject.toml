[project]
name = "breachload"
version = "0.11.0"
description = "Autonomous pentest copilot for Linux — guides recon-to-report, runs tools, analyzes output."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
breachload = "breachload.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breachload"]
artifacts = ["breachload/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# B008: typer uses `typer.Argument(...)`/`Option(...)` as default values by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The dashboard is a single embedded HTML/JS template string; line length there
# reflects markup, not Python.
"breachload/web/dashboard.py" = ["E501"]
